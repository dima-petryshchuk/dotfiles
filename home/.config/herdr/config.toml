onboarding = false
[keys]
prefix = "ctrl+b"

# navigation & workspace
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
workspace_picker = "prefix+w"
goto             = "prefix+g"
previous_workspace = "prefix+["
next_workspace     = "prefix+]"
switch_workspace   = "prefix+"  # + 1..9

# tabs
new_tab      = "prefix+c"
close_tab    = "prefix+ampersand"
rename_tab   = "prefix+shift+t"
previous_tab = "prefix+p"
next_tab     = "prefix+n"
switch_tab   = "prefix+"  # + 1..9

# panes
split_horizontal = "prefix+double_quote"
split_vertical   = "prefix+percent"
close_pane       = "prefix+x"
rename_pane      = "prefix+shift+p"
swap_pane_left   = "prefix+shift+h"
swap_pane_down   = "prefix+shift+j"
swap_pane_up     = "prefix+shift+k"
swap_pane_right  = "prefix+shift+l"
cycle_pane_next     = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
last_pane = "prefix+;"
zoom      = "prefix+z"

# editing & display
copy_mode       = "prefix+y"  # herdr's copy-mode entry key; copy-mode's own internal keys (v/space select, y/Enter copy, q/Esc cancel) aren't configurable
edit_scrollback = "prefix+e"
resize_mode     = "prefix+r"
toggle_sidebar  = "prefix+b"

# agents
previous_agent = "prefix+shift+["
next_agent     = "prefix+shift+]"
focus_agent    = "prefix+a"  # + 1..9

# workspace management
new_workspace    = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace  = "prefix+shift+d"
new_worktree     = "prefix+shift+g"

# system
help                    = "prefix+?"
settings                = "prefix+s"
reload_config           = "prefix+shift+r"
detach                  = "prefix+q"
open_notification_target = "prefix+o"

[ui]
# Agents panel order: explicit choice of "spaces" (grouped by space, the default) over "priority".
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = true
[theme]
name = "dracula"
auto_switch = false

[experimental]
switch_ascii_input_source_in_prefix = true
